<style>
:root{
  --bg:#f6f5f0; --dark:#0a1931; --fosfo:#39ff14; --verde:#16a34a;
  --rojo:#ef4444; --azul:#3b82f6; --ambar:#fbbf24; --radius:14px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:#111; overflow-x:hidden;
}
#app{max-width:1000px;margin:0 auto;padding:8px 8px 90px;}

/* ===== INICIO BLOQUE HEADER - NO TOCAR ===== */
header.app{
  background:var(--dark); border-radius:var(--radius);
  padding:10px 14px; margin-bottom:10px; color:#fff;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  position:sticky; top:0; z-index:50;
}
header.app .logo{width:42px;height:42px;border-radius:10px;flex:0 0 42px;}
header.app h1{font-size:1.05rem;letter-spacing:1px;flex:1;min-width:150px;}
header.app h1 small{display:block;font-size:.62rem;color:var(--fosfo);letter-spacing:2px;font-weight:400;}
header .sel-fecha-wrap{display:flex;gap:6px;align-items:center;}
#filtroFecha{
  background:#12244a;color:#fff;border:1px solid #2c4a8a;border-radius:8px;
  padding:7px 9px;font-size:.85rem;
}
.badge-hoy{
  background:var(--fosfo);color:var(--dark);font-weight:700;font-size:.75rem;
  border-radius:20px;padding:4px 10px;white-space:nowrap;
}
/* ===== FIN BLOQUE HEADER ===== */

/* ===== INICIO BLOQUE BARRA DE ACCIONES - NO TOCAR ===== */
.acciones{
  display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center;
}
.btn{
  border:none;border-radius:10px;padding:9px 13px;font-size:.82rem;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:transform .1s, filter .15s;
  font-family:inherit;
}
.btn:active{transform:scale(.95);}
.btn-dark{background:var(--dark);color:#fff;}
.btn-verde{background:var(--verde);color:#fff;}
.btn-rojo{background:var(--rojo);color:#fff;}
.btn-azul{background:var(--azul);color:#fff;}
.btn-claro{background:#fff;border:1.5px solid #d5d3ca;color:#333;}
.btn-fosfo{background:var(--fosfo);color:var(--dark);font-weight:800;}
.btn-wsp{background:#25d366;color:#fff;font-weight:700;}
.btn-lg{font-size:.95rem;padding:12px 18px;}
#buscador{
  flex:1;min-width:160px;padding:9px 13px;border-radius:10px;
  border:1.5px solid #d5d3ca;font-size:.9rem;background:#fff;font-family:inherit;
}
.filtros-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip{
  padding:6px 13px;border-radius:20px;font-size:.78rem;font-weight:700;cursor:pointer;
  background:#e9e7df;border:1.5px solid transparent;font-family:inherit;
}
.chip.activo{background:var(--dark);color:var(--fosfo);border-color:var(--fosfo);}
/* ===== FIN BLOQUE ACCIONES ===== */

/* ===== INICIO BLOQUE TABLA - NO TOCAR ===== */
.tabla-wrap{
  background:#fff;border-radius:var(--radius);overflow:auto;
  box-shadow:0 2px 8px rgba(0,0,0,.08);max-height:calc(100dvh - 300px);
}
table{width:100%;border-collapse:collapse;min-width:720px;}
thead th{
  position:sticky;top:0;background:var(--dark);color:#fff;font-size:.72rem;
  letter-spacing:.5px;padding:10px 8px;text-align:left;z-index:5;
}
tbody td{padding:9px 8px;font-size:.85rem;border-bottom:1px solid #eee;vertical-align:middle;}
tr.fila{position:relative;}
tr.fila:active{background:#f0fefe;}
/* pintado Rawson listo */
tr.fila-rawson-listo{background:#dcfce7 !important;}
tr.fila-rawson-listo td{color:#14532d;}
/* cambio de horario */
tr.fila-cambio-horario{background:#fef3c7 !important;}
/* posicion */
.pos{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:28px;height:28px;border-radius:8px;background:var(--dark);color:#fff;
  font-weight:800;font-size:.85rem;padding:0 6px;
}
.pos-rawson{background:var(--verde);color:#fff;}
.pos-trinidad{background:var(--azul);color:#fff;}
tr.fila-trinidad{border-left:5px solid var(--azul);}
/* dots estado */
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:4px;}
.dot-pendiente{background:#f59e0b;}
.dot-listo{background:var(--verde);}
.dot-no{background:#9ca3af;}
/* celda paciente con badges flotantes */
.celda-pac{position:relative;padding-right:70px !important;}
.nombre-pac{font-weight:700;}
.tel-pac{font-size:.75rem;color:#666;display:block;}
.dir-pac{font-size:.75rem;color:#555;}
/* badges flotantes */
.flotante{
  position:absolute;top:4px;right:6px;
  font-size:.62rem;font-weight:800;padding:3px 7px;border-radius:6px;
  letter-spacing:.5px;white-space:nowrap;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.flotante-poo{background:#000;color:var(--fosfo);}
.flotante-po{background:#111;color:#fff;border:1px solid var(--fosfo);}
.flotante-aviso{background:var(--ambar);color:#1f2937;font-weight:700;max-width:110px;white-space:normal;text-align:right;line-height:1.15;}
.flotante-orina{background:var(--fosfo);color:var(--dark);}
/* badge pago */
.badge-pago{
  display:inline-block;background:var(--verde);color:#fff;font-size:.72rem;
  border-radius:12px;padding:2px 8px;margin-left:6px;font-weight:800;
}
/* foto */
.btn-foto{
  width:40px;height:40px;border-radius:10px;border:1.5px solid #ddd;background:#fff;
  font-size:1.1rem;cursor:pointer;position:relative;font-family:inherit;
}
.btn-foto.hasFoto{background:var(--fosfo);border-color:var(--fosfo);box-shadow:0 0 8px var(--fosfo);}
.btn-foto .cnt{
  position:absolute;top:-5px;right:-5px;background:var(--dark);color:#fff;
  font-size:.6rem;border-radius:10px;padding:1px 5px;font-weight:700;
}
/* fila vacía */
.empty-row td{text-align:center;color:#999;padding:30px;font-style:italic;}
/* ===== FIN BLOQUE TABLA ===== */

/* ===== INICIO BLOQUE FOOTER - NO TOCAR ===== */
footer.bar{
  position:fixed;bottom:0;left:0;right:0;max-width:1000px;margin:0 auto;
  background:rgba(10,25,49,.97);backdrop-filter:blur(6px);
  display:flex;gap:6px;padding:8px;overflow-x:auto;border-radius:14px 14px 0 0;z-index:40;
}
footer.bar .btn{flex:0 0 auto;font-size:.72rem;padding:8px 10px;}
/* ===== FIN BLOQUE FOOTER ===== */

/* ===== INICIO BLOQUE MODALES - NO TOCAR ===== */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal.abierto{opacity:1;pointer-events:auto;}
.modal-caja{
  background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:92dvh;
  overflow-y:auto;padding:18px;transform:translateY(12px);transition:transform .2s;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}
.modal.abierto .modal-caja{transform:translateY(0);}
.modal-caja h3{font-size:1rem;margin-bottom:12px;color:var(--dark);display:flex;justify-content:space-between;align-items:center;}
.cerrar{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#999;}
.campo{margin-bottom:10px;}
.campo label{display:block;font-size:.72rem;font-weight:700;color:#555;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px;}
.campo input,.campo select,.campo textarea{
  width:100%;padding:10px;border-radius:9px;border:1.5px solid #d5d3ca;
  font-size:.9rem;font-family:inherit;background:#fff;
}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--fosfo);border-color:var(--fosfo);}
.campo-row{display:flex;gap:8px;}
.campo-row .campo{flex:1;}
/* switches iOS */
.switch-fila{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 4px;border-bottom:1px solid #f0efe9;
}
.switch-fila span{font-size:.88rem;font-weight:600;}
.sw{position:relative;width:50px;height:28px;flex:0 0 50px;}
.sw input{opacity:0;width:0;height:0;}
.sw .track{
  position:absolute;inset:0;background:var(--rojo);border-radius:20px;cursor:pointer;
  transition:background .2s;box-shadow:inset 0 1px 3px rgba(0,0,0,.25);
}
.sw .track:before{
  content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;
  top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.sw input:checked + .track{background:var(--fosfo);}
.sw input:checked + .track:before{transform:translateX(22px);}
.sw input:checked + .track:after{
  content:"✓";position:absolute;right:7px;top:4px;font-size:.8rem;color:var(--dark);font-weight:900;
}
.fotos-mini{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.foto-mini{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden;border:2px solid #ddd;}
.foto-mini img{width:100%;height:100%;object-fit:cover;}
.foto-mini .del-foto{
  position:absolute;top:2px;right:2px;background:var(--rojo);color:#fff;border:none;
  border-radius:50%;width:20px;height:20px;font-size:.65rem;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;font-weight:900;
}
.drop-zone{
  border:2px dashed #bbb;border-radius:12px;padding:14px;text-align:center;
  color:#777;font-size:.8rem;margin:8px 0;cursor:pointer;background:#fafaf7;
}
.drop-zone.over{border-color:var(--fosfo);background:#f0fff0;}
/* ===== FIN BLOQUE MODALES ===== */

/* ===== INICIO BLOQUE VISOR FOTO - NO TOCAR ===== */
#visorFoto{
  position:fixed;inset:0;background:#000;z-index:200;display:none;
  flex-direction:column;align-items:center;justify-content:center;
}
#visorFoto.abierto{display:flex;}
#visorFoto img{max-width:100%;max-height:85dvh;object-fit:contain;touch-action:none;transition:transform .1s;}
#visorFoto .visor-bar{
  position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:12px;background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:2;
}
#visorFoto .visor-bar button{
  background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:10px;
  padding:8px 14px;font-size:1.1rem;cursor:pointer;
}
/* ===== FIN BLOQUE VISOR ===== */

/* toast */
#toast{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--dark);color:#fff;padding:10px 18px;border-radius:12px;
  font-size:.85rem;opacity:0;transition:.25s;z-index:300;pointer-events:none;
  border-left:4px solid var(--fosfo);max-width:90vw;text-align:center;
}
#toast.mostrar{opacity:1;transform:translateX(-50%) translateY(0);}
.stats-line{font-size:.75rem;color:#666;margin-bottom:8px;padding:0 2px;}
@media (max-width:640px){
  .celda-pac{padding-right:60px !important;}
  thead th{font-size:.65rem;padding:8px 5px;}
  tbody td{font-size:.78rem;padding:7px 5px;}
}
</style>
</head>

<div id="app">
<script>
/* ================================================================
   // MODULO V12.1 - TRAMPA GLOBAL DE ERRORES (diagnóstico visible)
   Si algo falla, se MUESTRA en pantalla: no más botones muertos en silencio.
   ================================================================ */
window.__prexaErrores = [];
function v12_onGlobalError(msg, url, line, col){
  try{
    window.__prexaErrores.push(String(msg) + ' @' + (url||'').split('/').pop() + ':' + line);
    let b = document.getElementById('errBanner');
    if(!b){
      b = document.createElement('div');
      b.id = 'errBanner';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#ef4444;color:#fff;font:12px/1.4 monospace;padding:8px 10px;white-space:pre-wrap;max-height:45vh;overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.4);text-align:left';
      (document.body || document.documentElement).appendChild(b);
    }
    b.textContent = '⚠️ ERROR PREXA (copie este texto y envíelo):\n' + window.__prexaErrores.slice(-6).join('\n');
  }catch(_){}
}
window.addEventListener('error', function(e){ v12_onGlobalError(e.message, e.filename, e.lineno, e.colno); });
window.addEventListener('unhandledrejection', function(e){ v12_onGlobalError('Promesa: ' + (e.reason && e.reason.message || e.reason)); });
</script>
